# The whole stack in containers.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Separate from docker-compose.yml, which runs only Postgres for local
# development with the app on the host. Keeping them apart means the development
# file stays a one-liner and this one can be read as a deployment description.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repo_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-repo_radar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repo_radar}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-repo_radar}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repo_radar}
      DEBUG: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        # Waits for the healthcheck, not just the container. Starting before
        # Postgres accepts connections means migrations fail on boot.
        condition: service_healthy
    restart: unless-stopped
    # The cloner writes untrusted repositories here. tmpfs keeps them off the
    # host disk and guarantees they are gone when the container stops.
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the client bundle at build time, so it is a build
        # argument rather than an environment variable.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
