<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 380" width="840" height="380"
     role="img" aria-label="Animated terminal introducing Aiatulla, full-stack engineer">
  <!-- ============================================================
       EDIT ME: the <text> contents below are your bio lines.
       Everything is pure SMIL/CSS - no JS - so GitHub's camo proxy
       serves it and it still animates.
       ============================================================ -->
  <title>aiatulla@dev — zsh</title>

  <style>
    .win   { fill: #f6f8fa; stroke: #d0d7de; }
    .bar   { fill: #eaeef2; }
    .title { fill: #656d76; }
    .txt   { fill: #1f2328; }
    .dim   { fill: #656d76; }
    .grn   { fill: #1a7f37; }
    .blu   { fill: #0969da; }
    .pur   { fill: #8250df; }
    .orn   { fill: #bc4c00; }
    .spark { stroke: #8250df; }
    .grid  { stroke: #d0d7de; }
    .cursor{ fill: #1a7f37; }
    .scan  { stop-color: #0969da; }

    @media (prefers-color-scheme: dark) {
      .win   { fill: #0d1117; stroke: #30363d; }
      .bar   { fill: #161b22; }
      .title { fill: #7d8590; }
      .txt   { fill: #c9d1d9; }
      .dim   { fill: #6e7681; }
      .grn   { fill: #7ee787; }
      .blu   { fill: #79c0ff; }
      .pur   { fill: #d2a8ff; }
      .orn   { fill: #ffa657; }
      .spark { stroke: #d2a8ff; }
      .grid  { stroke: #21262d; }
      .cursor{ fill: #7ee787; }
      .scan  { stop-color: #79c0ff; }
    }

    text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .sm  { font-size: 11.5px; letter-spacing: .08em; }
  </style>

  <defs>
    <!-- soft outer glow for the accent stroke -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- CRT scanline sweep -->
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop class="scan" offset="0%"   stop-opacity="0"/>
      <stop class="scan" offset="50%"  stop-opacity="0.10"/>
      <stop class="scan" offset="100%" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="card"><rect x="10" y="10" width="820" height="360" rx="14"/></clipPath>

    <!-- one typing mask per line: a rect that grows left-to-right -->
    <clipPath id="t1"><rect x="30" y="76"  width="0" height="22"><animate attributeName="width" from="0" to="790" dur="0.45s" begin="0.30s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="30" y="104" width="0" height="22"><animate attributeName="width" from="0" to="790" dur="0.65s" begin="0.85s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="30" y="140" width="0" height="22"><animate attributeName="width" from="0" to="790" dur="0.45s" begin="1.65s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="30" y="168" width="0" height="22"><animate attributeName="width" from="0" to="790" dur="0.75s" begin="2.20s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="30" y="204" width="0" height="22"><animate attributeName="width" from="0" to="790" dur="0.45s" begin="3.05s" fill="freeze"/></rect></clipPath>
    <clipPath id="t6"><rect x="30" y="232" width="0" height="22"><animate attributeName="width" from="0" to="790" dur="0.65s" begin="3.60s" fill="freeze"/></rect></clipPath>
    <clipPath id="t7"><rect x="30" y="268" width="0" height="22"><animate attributeName="width" from="0" to="790" dur="0.25s" begin="4.35s" fill="freeze"/></rect></clipPath>

    <!-- the sparkline path, referenced twice (draw + travelling dot) -->
    <path id="wave" d="M40 336 L92 322 L144 330 L196 305 L248 314 L300 288 L352 298 L404 272
                       L456 284 L508 258 L560 268 L612 246 L664 256 L716 232 L768 244 L800 226"/>
  </defs>

  <!-- ========== window ========== -->
  <rect class="win" x="10" y="10" width="820" height="360" rx="14" stroke-width="1.5"/>
  <path class="bar" d="M10 24a14 14 0 0 1 14-14h792a14 14 0 0 1 14 14v22H10z"/>
  <circle cx="36" cy="28" r="5.5" fill="#ff5f57"/>
  <circle cx="56" cy="28" r="5.5" fill="#febc2e"/>
  <circle cx="76" cy="28" r="5.5" fill="#28c840"/>
  <text class="title sm" x="420" y="32" text-anchor="middle">aiatulla@dev — zsh — 84×24</text>
  <line class="grid" x1="10" y1="46" x2="830" y2="46" stroke-width="1"/>

  <!-- ========== typed lines ========== -->
  <g clip-path="url(#t1)">
    <text y="92" x="30"><tspan class="grn">$</tspan><tspan class="txt" dx="8">whoami</tspan></text>
  </g>
  <g clip-path="url(#t2)">
    <text y="120" x="30" class="dim">↳ <tspan class="txt">full-stack engineer</tspan> · <tspan class="blu">FastAPI</tspan> + <tspan class="blu">Next.js</tspan> · <tspan class="pur">GCP</tspan></text>
  </g>

  <g clip-path="url(#t3)">
    <text y="156" x="30"><tspan class="grn">$</tspan><tspan class="txt" dx="8">cat stack.json</tspan></text>
  </g>
  <g clip-path="url(#t4)">
    <text y="184" x="30" class="dim">{ <tspan class="pur">"api"</tspan>: <tspan class="orn">"python"</tspan>, <tspan class="pur">"web"</tspan>: <tspan class="orn">"typescript"</tspan>, <tspan class="pur">"db"</tspan>: <tspan class="orn">"postgres"</tspan> }</text>
  </g>

  <g clip-path="url(#t5)">
    <text y="220" x="30"><tspan class="grn">$</tspan><tspan class="txt" dx="8">uptime</tspan></text>
  </g>
  <g clip-path="url(#t6)">
    <text y="248" x="30" class="dim">▲ <tspan class="txt">async everywhere</tspan> · <tspan class="grn">0 unhandled promises</tspan> · load avg <tspan class="txt">0.42</tspan></text>
  </g>

  <g clip-path="url(#t7)">
    <text y="284" x="30"><tspan class="grn">$</tspan></text>
  </g>
  <rect class="cursor" x="46" y="270" width="9" height="17" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;0.01;0.5;0.51;0.99;1"
             dur="1.1s" begin="4.6s" repeatCount="indefinite"/>
  </rect>

  <!-- ========== sparkline ========== -->
  <line class="grid" x1="30" y1="306" x2="810" y2="306" stroke-width="1" stroke-dasharray="2 6"/>
  <use href="#wave" xlink:href="#wave" class="spark" fill="none" stroke-width="2.5" stroke-linecap="round"
       stroke-linejoin="round" filter="url(#glow)" stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="2.6s" begin="4.4s" fill="freeze"/>
  </use>
  <circle r="4" class="cursor" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.2s" begin="7.0s" fill="freeze"/>
    <animateMotion dur="4s" begin="7.0s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wave" xlink:href="#wave"/>
    </animateMotion>
  </circle>
  <text class="dim sm" x="30" y="358">COMMITS / WEEK</text>
  <text class="dim sm" x="810" y="358" text-anchor="end">▲ TRENDING</text>

  <!-- ========== CRT sweep (drawn last, clipped to the card) ========== -->
  <g clip-path="url(#card)">
    <rect x="10" width="820" height="70" y="-70" fill="url(#sweep)">
      <animate attributeName="y" from="-70" to="380" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
