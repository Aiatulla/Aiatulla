[project]
name = "repo-radar-backend"
version = "0.1.0"
description = "Multi-agent repository auditor - API and orchestration layer"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Used by the Gemini adapter, so it is a runtime dependency, not a test one.
    "httpx>=0.27",
    "alembic>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, N naming, UP modern syntax,
# B bugbear (likely bugs), SIM simplification, RUF ruff-specific.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
# SQLAlchemy and FastAPI decorators confuse mypy without their plugins.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
# Test functions return None and take fixtures; annotating every one adds noise, not safety.
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# -ra: a skipped evaluation is not a passing evaluation, so the reason shows in
#   the CI log instead of a bare "s" in the progress line.
# --ignore: fixture repositories contain files named test_*.py on purpose. They
#   are input data for the auditors, not tests of this project, and collecting
#   them would run deliberately broken code.
addopts = "-ra --ignore=tests/fixtures"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]

[tool.ruff.lint.per-file-ignores]
# Fixture repositories contain deliberately bad code. Linting them would fight
# the defects that are planted there on purpose.
"tests/fixtures/**" = ["ALL"]
