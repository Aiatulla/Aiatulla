name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv venv --python 3.11 && uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format
        run: .venv/bin/ruff format --check .

      - name: Typecheck
        run: .venv/bin/mypy app

      # No database service: these tests call the app in-process and never open a
      # socket. Postgres joins this job in Phase 2, when there is a schema to test.
      - name: Test
        run: .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
