version: 2

# Advisories appear without the code changing, so updates are checked on a
# schedule rather than only when someone edits a manifest.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for routine bumps. Reviewing ten separate patch bumps
      # is how people start merging them without reading.
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The workflow pins actions by major tag, which moves under us. This keeps
  # those visible rather than silently drifting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
