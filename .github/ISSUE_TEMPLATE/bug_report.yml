name: Bug report
description: Something behaved differently from what it documents
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key.** If one has appeared in a log or an error you
        are about to share, rotate it first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what you expected instead.
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Repository audited
      description: The URL, if it is public. Skip this if it is not.
      placeholder: https://github.com/owner/name

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Anthropic, Gemini, OpenAI, Not applicable]

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: gemini-flash-latest

  - type: textarea
    id: run-state
    attributes:
      label: Run status and error
      description: >
        From `GET /api/v1/runs/{id}` or the run page. The error message is more
        useful than a description of it.
      render: text

  - type: textarea
    id: verification
    attributes:
      label: Does the test suite pass?
      description: >
        Output of `pytest -q` in `backend/`. It needs no API key and no network,
        so it is quick and it separates a local problem from a real one.
      render: text
